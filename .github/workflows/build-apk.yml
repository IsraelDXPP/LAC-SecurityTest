name: Build Mod APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool

      - name: Make build script executable
        run: chmod +x apk-builder/build-apk.sh

      - name: Build modded APK
        working-directory: apk-builder
        run: |
          # Create output directory
          mkdir -p output
          
          # Copy smali files to APK
          cp -r smali/com/lac/modmenu/* ../../LAC_apktool/smali_classes9/com/lac/modmenu/ 2>/dev/null || \
          mkdir -p ../../LAC_apktool/smali_classes9/com/lac/modmenu/ && \
          cp -r smali/com/lac/modmenu/* ../../LAC_apktool/smali_classes9/com/lac/modmenu/
          
          # Modify AndroidManifest.xml
          sed -i 's/com.unity3d.player.UnityPlayerActivity/com.lac.modmenu.ModMenuActivity/g' ../../LAC_apktool/AndroidManifest.xml
          
          # Add overlay permission
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"\/>\n<\/manifest>/g' ../../LAC_apktool/AndroidManifest.xml
          
          # Build with apktool
          apktool b ../../LAC_apktool -o output/LAC_ModMenu.apk

      - name: Generate signing key
        run: |
          keytool -genkey -v \
            -keystore apk-builder/keystore/release.keystore \
            -alias lac-modmenu \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password \
            -keypass password \
            -dname "CN=LAC Mod Menu, OU=Security Test, O=LAC, L=Unknown, ST=Unknown, C=US"

      - name: Sign APK
        run: |
          # Align APK
          zipalign -f 4 apk-builder/output/LAC_ModMenu.apk apk-builder/output/LAC_ModMenu_Aligned.apk
          
          # Sign APK
          apksigner sign \
            --ks apk-builder/keystore/release.keystore \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out apk-builder/output/LAC_ModMenu_Signed.apk \
            apk-builder/output/LAC_ModMenu_Aligned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAC-ModMenu-APK
          path: apk-builder/output/LAC_ModMenu_Signed.apk
          retention-days: 30

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: LAC-ModMenu-Unsigned
          path: apk-builder/output/LAC_ModMenu.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: LAC-ModMenu-APK

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: LAC_ModMenu_Signed.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
