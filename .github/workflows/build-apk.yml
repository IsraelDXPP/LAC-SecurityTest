name: Build Mod APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GOOGLE_DRIVE_ID: 1ELLS0Z7nqLZsjCJtVdRWVJj0sbWL2h_Y

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          curl -sL https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.11.1.jar -o /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Setup Android SDK tools
        run: |
          # Android SDK is pre-installed on GitHub runners
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls ${ANDROID_HOME}/build-tools/ 2>/dev/null || echo "No build-tools found"
          
          # Find the latest build-tools version
          BUILD_TOOLS=$(ls ${ANDROID_HOME}/build-tools/ 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS" ]; then
            echo "Found build-tools: $BUILD_TOOLS"
            echo "${ANDROID_HOME}/build-tools/$BUILD_TOOLS" >> $GITHUB_PATH
          else
            echo "Installing build-tools via sdkmanager..."
            yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || \
            yes | ${ANDROID_HOME}/tools/bin/sdkmanager "build-tools;34.0.0" || \
            sudo apt-get install -y -qq apksigner zipalign 2>/dev/null || true
            
            BUILD_TOOLS=$(ls ${ANDROID_HOME}/build-tools/ 2>/dev/null | sort -V | tail -1)
            if [ -n "$BUILD_TOOLS" ]; then
              echo "${ANDROID_HOME}/build-tools/$BUILD_TOOLS" >> $GITHUB_PATH
            fi
          fi
          
          # Ensure zipalign and apksigner are available
          which zipalign && echo "zipalign: $(which zipalign)" || echo "zipalign not found"
          which apksigner && echo "apksigner: $(which apksigner)" || echo "apksigner not found"

      - name: Download XAPK from Google Drive
        run: |
          echo "Downloading LAC 1.9.6 XAPK from Google Drive..."
          FILE_ID="${{ env.GOOGLE_DRIVE_ID }}"
          
          # Use gdown for reliable Google Drive downloads
          pip install gdown
          
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O LAC.xapk
          
          if [ ! -f "LAC.xapk" ] || [ ! -s "LAC.xapk" ]; then
            echo "gdown failed, trying alternative method..."
            # Alternative: use curl with cookie handling
            curl -c /tmp/cookies.txt -sL "https://drive.google.com/uc?export=download&id=${FILE_ID}" > /tmp/confirm.html
            CONFIRM=$(grep -oP 'confirm=([^&"]+)' /tmp/confirm.html | head -1 | cut -d= -f2)
            if [ -n "$CONFIRM" ]; then
              curl -b /tmp/cookies.txt -sL "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o LAC.xapk
            else
              curl -b /tmp/cookies.txt -sL "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o LAC.xapk
            fi
          fi
          
          echo "Downloaded file:"
          ls -lh LAC.xapk
          file LAC.xapk
          
          # Verify it's a valid file
          if file LAC.xapk | grep -q "HTML"; then
            echo "ERROR: Got HTML instead of APK file"
            head -c 200 LAC.xapk
            exit 1
          fi

      - name: Extract XAPK
        run: |
          echo "Extracting XAPK..."
          mkdir -p LAC_extracted
          unzip -q LAC.xapk -d LAC_extracted
          
          echo "Contents:"
          ls -lh LAC_extracted/
          
          # Find the base APK
          BASE_APK=$(find LAC_extracted -name "*.apk" -not -name "split_*" | head -1)
          
          if [ -z "$BASE_APK" ]; then
            echo "Base APK not found, looking for any APK..."
            BASE_APK=$(find LAC_extracted -name "*.apk" | head -1)
          fi
          
          echo "Base APK: $BASE_APK"
          
          # Save OBB if it exists
          OBB_DIR="LAC_extracted/Android/obb/com.MA.LAC"
          if [ -d "$OBB_DIR" ]; then
            echo "OBB found:"
            ls -lh "$OBB_DIR/"
            mkdir -p output/obb
            cp "$OBB_DIR"/*.obb output/obb/ 2>/dev/null || true
          else
            echo "No OBB found"
          fi
          
          # Decompile with apktool
          echo "Decompiling APK with apktool..."
          apktool d "$BASE_APK" -o LAC_apktool -f
          
          echo "Decompilation complete"
          ls -la LAC_apktool/

      - name: Inject mod menu smali
        run: |
          echo "Injecting mod menu smali code..."
          
          # Create modmenu directory
          mkdir -p LAC_apktool/smali_classes9/com/lac/modmenu/
          
          # Copy smali files
          cp -r apk-builder/smali/com/lac/modmenu/* LAC_apktool/smali_classes9/com/lac/modmenu/
          
          echo "Injected files:"
          ls -la LAC_apktool/smali_classes9/com/lac/modmenu/

      - name: Modify AndroidManifest.xml
        run: |
          echo "Modifying AndroidManifest.xml..."
          
          # Replace UnityPlayerActivity with ModMenuActivity
          sed -i 's/com.unity3d.player.UnityPlayerActivity/com.lac.modmenu.ModMenuActivity/g' LAC_apktool/AndroidManifest.xml
          
          # Add overlay permission before </manifest>
          sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>' LAC_apktool/AndroidManifest.xml
          
          echo "AndroidManifest.xml modified:"
          grep -n "ModMenuActivity\|SYSTEM_ALERT" LAC_apktool/AndroidManifest.xml || true

      - name: Build APK
        run: |
          echo "Building modded APK..."
          mkdir -p output
          apktool b LAC_apktool -o output/LAC_ModMenu.apk -f
          
          if [ ! -f "output/LAC_ModMenu.apk" ]; then
            echo "ERROR: APK build failed"
            exit 1
          fi
          
          ls -lh output/LAC_ModMenu.apk
          echo "Build complete"

      - name: Generate signing key
        run: |
          mkdir -p keystore
          keytool -genkey -v \
            -keystore keystore/release.keystore \
            -alias lac-modmenu \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password \
            -keypass password \
            -dname "CN=LAC Mod Menu, OU=Security Test, O=LAC, L=Unknown, ST=Unknown, C=US"

      - name: Align and sign APK
        run: |
          echo "Aligning APK..."
          zipalign -f 4 output/LAC_ModMenu.apk output/LAC_ModMenu_Aligned.apk
          
          echo "Signing APK..."
          apksigner sign \
            --ks keystore/release.keystore \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out output/LAC_ModMenu_Signed.apk \
            output/LAC_ModMenu_Aligned.apk
          
          echo "Verifying signature..."
          apksigner verify --verbose output/LAC_ModMenu_Signed.apk
          
          echo "Final APK:"
          ls -lh output/LAC_ModMenu_Signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LAC-ModMenu-Signed
          path: output/LAC_ModMenu_Signed.apk
          retention-days: 30

      - name: Upload OBB
        if: hashFiles('output/obb/*.obb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: LAC-OBB
          path: output/obb/*.obb
          retention-days: 30

      - name: Summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| LAC_ModMenu_Signed.apk | $(du -h output/LAC_ModMenu_Signed.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          if ls output/obb/*.obb 1>/dev/null 2>&1; then
            echo "| OBB | $(du -h output/obb/*.obb | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Install APK" >> $GITHUB_STEP_SUMMARY
          echo "adb install LAC_ModMenu_Signed.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Push OBB (required!)" >> $GITHUB_STEP_SUMMARY
          echo "adb shell mkdir -p /sdcard/Android/obb/com.MA.LAC" >> $GITHUB_STEP_SUMMARY
          echo "adb push main.59.com.MA.LAC.obb /sdcard/Android/obb/com.MA.LAC/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Launch" >> $GITHUB_STEP_SUMMARY
          echo "adb shell am start -n com.MA.LAC/com.lac.modmenu.ModMenuActivity" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: LAC-ModMenu-Signed

      - name: Download OBB
        uses: actions/download-artifact@v4
        with:
          name: LAC-OBB
          path: obb
        continue-on-error: true

      - name: Get version
        id: version
        run: echo "version=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "LAC Mod Menu v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: |
            LAC_ModMenu_Signed.apk
            obb/*.obb
          generate_release_notes: true
          body: |
            ## LAC Mod Menu
            
            **Build**: ${{ steps.version.outputs.version }}
            
            ### Install
            ```bash
            adb install LAC_ModMenu_Signed.apk
            adb push main.59.com.MA.LAC.obb /sdcard/Android/obb/com.MA.LAC/
            ```
            
            ### Hacks
            - God Mode, Infinite Health, Unlimited Ammo
            - Speed Hack, Super Jump, No Recoil, One Hit Kill
            - Vehicle God Mode, Unlimited Fuel
            - View All Players, Infinite Coin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
