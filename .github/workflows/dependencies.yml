name: Dependencies

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Check for dependency updates
        uses: dependabot/fetch-metadata@v1
        id: dependabot

      - name: Create pull request for dependency updates
        if: steps.dependabot.outputs.update-type == 'version-update:semver-patch'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dependencies/update
          title: 'chore(deps): update dependencies'
          body: |
            Automated dependency update
            
            Updated packages:
            - ${{ steps.dependabot.outputs.dependency-names }}
            
            Update type: ${{ steps.dependabot.outputs.update-type }}
          labels: |
            dependencies
            automated
