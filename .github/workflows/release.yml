name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate changelog
        id: changelog
        uses: conventional-changelog/standard-version@v9
        with:
          skip.bump: true
          skip.commit: true
          skip.tag: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Changes
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd LAC-SecurityTest
            npm install
            npm run build
            ```
            
            ## Usage
            
            ```bash
            # Inject agent
            npm run inject
            
            # List vulnerabilities
            npm run list
            
            # Toggle menu
            npm run menu
            ```
          files: |
            dist/**/*.js
            dist/**/*.d.ts
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
